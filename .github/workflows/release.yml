# A release from a tag, with no other hands on it: bump versionName (and versionCode) in
# app/build.gradle.kts, write .github/releases/<version>.md, commit, then tag and push it:
#
#   git tag v1.4.0 && git push origin v1.4.0
#
# This builds the signed APK, draws the banner and publishes the release with both. The tag
# must match versionName. Secrets: KEYSTORE_BASE64 (the release keystore, base64),
# KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Without them, or with an APK signed by
# any other key, it stops before publishing: a release under another key could not update
# installed apps.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  # The release key's certificate (README, "Install"): every release must carry it.
  CERT_SHA256: 1cbc9cf83b735a3cd4d9cca201ae0d09e33555f0cb3c3dd7c324a5a3feb93f43

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Version
        id: v
        run: |
          version="${GITHUB_REF_NAME#v}"
          gradle=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ "$version" != "$gradle" ]]; then
            echo "::error::tag $GITHUB_REF_NAME but versionName is $gradle: tag the commit that bumps it"
            exit 1
          fi
          if [[ ! -f ".github/releases/$version.md" ]]; then
            echo "::error::.github/releases/$version.md is missing"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE" ]]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set"
            exit 1
          fi
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # As the local builds: the newest build tools' apksigner needs it.
          java-version: 25

      # The runner's own SDK (ANDROID_HOME): its sdkmanager takes the licences, and AGP fetches
      # the platform and build tools it needs.
      - name: Android SDK
        run: |
          echo "$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin | sort -V | tail -1)" >> "$GITHUB_PATH"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build the APK
        env:
          II_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          II_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          II_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          II_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          yes | sdkmanager --licenses > /dev/null
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "stelnet-tools-${{ steps.v.outputs.version }}.apk"

      - name: Check the signature
        run: |
          apk="stelnet-tools-${{ steps.v.outputs.version }}.apk"
          # The newest build tools whose apksigner runs here; its errors stay in the log.
          got=""
          for bt in $(ls -d "$ANDROID_HOME"/build-tools/* | sort -Vr); do
            out=$("$bt/apksigner" verify --print-certs "$apk" 2>&1) || { echo "$bt: $out" | tail -n 3; continue; }
            # Every signer's certificate, however this version labels the line ("Signer #1",
            # "Signer (minSdkVersion=…)", "V2 Signer:"): all must be the release key.
            got=$(echo "$out" | sed -nE 's/^.*certificate SHA-256 digest: ([0-9a-f]{64})$/\1/p' | sort -u | paste -sd,)
            echo "checked with $bt"
            break
          done
          if [[ "$got" != "$CERT_SHA256" ]]; then
            echo "$out"
            echo "::error::the APK is signed by '$got', not the release key ($CERT_SHA256)"
            exit 1
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Draw the banner
        run: |
          pip install --quiet numpy pillow
          python3 tools/make-release-banner.py --out "stelnet-tools-${{ steps.v.outputs.version }}-banner.png"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          repo="${{ github.repository }}"
          # The fingerprint as the README prints it: upper case, colon separated.
          cert=$(echo "$CERT_SHA256" | tr a-f A-F | sed 's/../&:/g; s/:$//')
          {
            echo "![Stelnet Tools $V](https://github.com/$repo/releases/download/v$V/stelnet-tools-$V-banner.png)"
            echo
            # The notes: everything below the first '---' (above it is the banner's).
            sed '1,/^---/d' ".github/releases/$V.md"
            echo
            echo "**Install:** download \`stelnet-tools-$V.apk\` below and follow the [install steps](https://github.com/$repo#install). It updates earlier releases in place, and from 1.4.0 on the app offers new ones itself."
            echo
            echo "Signing certificate SHA-256: \`$cert\`"
          } > notes.md
          gh release create "v$V" \
            --verify-tag \
            --title "Stelnet Tools $V" \
            --notes-file notes.md \
            "stelnet-tools-$V.apk" "stelnet-tools-$V-banner.png"
