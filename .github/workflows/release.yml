name: Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: android-actions/setup-android@v3
      - name: Install SDK platform
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0" || true
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Build
        env:
          II_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          II_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          II_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          II_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Name the APK
        run: |
          V="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/*.apk "stelnet-tools-$V.apk"
          sha256sum "stelnet-tools-$V.apk"
      - uses: softprops/action-gh-release@v2
        with:
          files: stelnet-tools-*.apk
          generate_release_notes: true
