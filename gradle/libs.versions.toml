[versions]
agp = "9.5.1"
kotlin = "2.4.21"
composeBom = "2026.09.00"
# Material 3 Expressive (MaterialExpressiveTheme, wavy progress, shapes, connected buttons).
material3 = "1.5.0-rc01"
activityCompose = "1.13.0"
coreKtx = "1.19.1"
lifecycle = "2.11.0"
# Installs the baseline profiles Compose ships, so release builds start and scroll warm.
profileinstaller = "1.4.1"
# ii link: WebSocket over TLS with a pinned certificate.
okhttp = "5.3.0"
# Google's scanner UI from Play services: no camera permission, no ML Kit in the APK.
codeScanner = "16.1.0"
# Browsing the phone's files from the PC: an SFTP server, as KDE Connect does.
sshd = "2.20.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-process = { group = "androidx.lifecycle", name = "lifecycle-process", version.ref = "lifecycle" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3", version.ref = "material3" }

okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
play-services-code-scanner = { group = "com.google.android.gms", name = "play-services-code-scanner", version.ref = "codeScanner" }
apache-sshd-core = { group = "org.apache.sshd", name = "sshd-core", version.ref = "sshd" }
apache-sshd-sftp = { group = "org.apache.sshd", name = "sshd-sftp", version.ref = "sshd" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
